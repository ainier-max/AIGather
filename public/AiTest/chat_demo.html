<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能助手 - 大坝安全监测</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background: white;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        .chat-header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            padding: 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: #f9fafb;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            position: relative;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .message.user .bubble {
            background-color: #eff6ff;
            color: #1e3a8a;
            border-bottom-right-radius: 2px;
            border: 1px solid #dbeafe;
        }

        .message.ai .bubble {
            background-color: white;
            color: #1f2937;
            border-bottom-left-radius: 2px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .chat-input {
            padding: 1rem;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .chat-input textarea {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            resize: none;
            outline: none;
            height: 50px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .chat-input textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .send-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0 1.5rem;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .send-btn:hover {
            background-color: #1d4ed8;
        }

        .send-btn:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        /* Thinking Process Styles */
        .thinking-process {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 0.5rem;
            background: #f3f4f6;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 3px solid #9ca3af;
            display: none;
        }

        .thinking-process.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .thinking-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #4b5563;
        }

        /* Markdown Styles */
        .markdown-body p {
            margin-bottom: 0.75rem;
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .markdown-body h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #111827;
        }

        .markdown-body code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #0f172a;
        }

        .markdown-body pre {
            background-color: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        .markdown-body pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* 响应式优化：小屏幕或 iframe 模式下铺满全屏 */
        @media (max-width: 600px) {
            body {
                padding: 0;
                overflow: hidden;
                /* 防止双重滚动 */
            }

            .chat-container {
                margin: 0;
                width: 100%;
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
                display: flex;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-xl">🤖</div>
                <div>
                    <h1 class="font-bold text-lg">大坝智能诊断助手</h1>
                    <p class="text-xs text-blue-100 opacity-90">Powered by 知识图谱 & Qwen Agent</p>
                </div>
            </div>
            <button onclick="clearChat()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded transition">
                清空对话
            </button>
        </div>

        <div class="chat-messages" id="chat-box">
            <!-- Initial Greeting -->
            <div class="message ai">
                <div class="bubble">
                    <div class="markdown-body">
                        你好！我是基于知识图谱的智能诊断助手。<br>
                        你可以问我：
                        <ul>
                            <li>"查一下 UP402 测点的当前状态"</li>
                            <li>"为什么 UP402 有异常？请做根因分析"</li>
                            <li>"左岸坝段的安全状况如何？"</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input container">
            <textarea id="user-input" placeholder="输入问题..." onkeydown="handleEnter(event)"></textarea>
            <button onclick="sendMessage()" id="send-btn" class="send-btn">
                <span>发送</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path
                        d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(role, text, thinking = null, id = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            if (id) msgDiv.id = id;

            let contentHtml = '';

            // Add thinking block if exists (for AI)
            if (thinking) {
                contentHtml += `
                <div class="thinking-process active">
                    <div class="thinking-header">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Thinking Process
                    </div>
                    <div class="thinking-content text-xs whitespace-pre-wrap">${thinking}</div>
                </div>
            `;
            }

            // Markdown parsing for main content
            const parsedContent = role === 'ai' ? marked.parse(text) : text.replace(/\n/g, '<br>');
            contentHtml += `<div class="bubble"><div class="markdown-body">${parsedContent}</div></div>`;

            msgDiv.innerHTML = contentHtml;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const id = 'typing-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = 'message ai';
            msgDiv.innerHTML = `
            <div class="bubble" style="padding: 0.75rem 1rem;">
                <div class="typing-indicator"><span></span><span></span><span></span></div>
            </div>
        `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI Updates
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = '50px';
            userInput.disabled = true;
            sendBtn.disabled = true;

            const aiMsgId = 'ai-msg-' + Date.now();
            // Create a container for the AI message immediately
            appendMessage('ai', '', null, aiMsgId);
            const msgContainer = document.getElementById(aiMsgId);
            const markdownContainer = msgContainer.querySelector('.markdown-body');

            let fullText = "";
            let thinkingText = "";

            try {
                const response = await fetch('http://192.168.25.44:4090/api/smart/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, session_id: "default", stream: true })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);

                            if (data === '[DONE]') break;

                            if (data.startsWith('[ERROR]')) {
                                fullText += "\n\n❌ Error: " + data.slice(7);
                            } else if (data.startsWith('[TOOL_START]')) {
                                // Show tool status
                                const toolInfo = data.slice(12);
                                fullText += `\n> 🔧 ${toolInfo}...\n\n`;
                            } else if (data.startsWith('[TOOL_END]')) {
                                // fullText += `\n> ✅ Tool Done.\n\n`;
                            } else if (data.startsWith('[THINKING]')) {
                                // Handle Thinking
                                if (!document.querySelector(`#${aiMsgId} .thinking-process`)) {
                                    // Insert thinking block if missing
                                    const thinkHtml = `
                                        <div class="thinking-process active">
                                            <div class="thinking-header">
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                Thinking Process
                                            </div>
                                            <div class="thinking-content text-xs whitespace-pre-wrap"></div>
                                        </div>`;
                                    msgContainer.querySelector('.bubble').insertAdjacentHTML('afterbegin', thinkHtml);
                                }
                                const thinkContentEl = document.querySelector(`#${aiMsgId} .thinking-content`);
                                thinkingText += data.slice(10);
                                thinkContentEl.textContent = thinkingText;
                                // Auto scroll thinking area?

                            } else {
                                // Normal content
                                fullText += data;
                            }

                            // Render Markdown
                            markdownContainer.innerHTML = marked.parse(fullText);
                            chatBox.scrollTop = chatBox.scrollHeight;
                        }
                    }
                }

            } catch (error) {
                markdownContainer.innerHTML += `\n\n❌ Network Error: ${error.message}`;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        async function clearChat() {
            // Also clear backend history
            try {
                await fetch('/api/smart/history?session_id=default', { method: 'DELETE' });
            } catch (e) {
                console.error("Failed to clear backend history", e);
            }

            chatBox.innerHTML = `
            <div class="message ai">
                <div class="bubble">
                    <div class="markdown-body">
                        对话已清空。请随时提问！
                    </div>
                </div>
            </div>
        `;
        }
    </script>

</body>

</html>
